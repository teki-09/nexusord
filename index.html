function recordById(id){return state.records.find(x=>x.id===id)}

const info=(k,v)=>`<div class="info-pair"><div class="k">${enc(k)}</div><div class="v">${v}</div></div>`;
const heading=(eye,title,description,actions='')=>`<div class="page-head"><div><div class="eyebrow">${enc(eye)}</div><h1>${enc(title)}</h1><p class="sub">${enc(description)}</p></div>${actions?`<div class="stack">${actions}</div>`:''}</div>`;
function navHtml(){return NAV.map(([v,i,name])=>`<button class="nav-btn ${state.activeView===v?'active':''}" data-go="${v}" aria-current="${state.activeView===v?'page':'false'}"><span class="nav-icon">${i}</span>${name}${v==='piracy'?'<span class="soon">SIM</span>':''}</button>`).join('')}
function changeView(v){state.activeView=(v==='details'||NAV.some(a=>a[0]===v))?v:'overview';persist();render();window.scrollTo?.({top:0,behavior:'instant'})}
function render(){el('sideNav').innerHTML=navHtml();el('mobileNav').innerHTML=navHtml();el('blockChip').textContent='Block '+number(state.blockHeight);el('sectionName').textContent=NAV.find(x=>x[0]===state.activeView)?.[2]||'Overview';const map={overview:overview,studio:studio,assets:assets,details:details,provenance:provenance,rights:rights,tokens:tokens,piracy:piracy,node:node,architecture:architecture};el('page').innerHTML=(map[state.activeView]||overview)();}
function choiceRecords(selected){return state.records.map(r=>`<option value="${enc(r.id)}" ${r.id===selected?'selected':''}>${enc(r.title)} — ${enc(r.artist)}</option>`).join('')}
function attrGradient(i){return [['#204984','#153149'],['#6b3477','#232c63'],['#186864','#173850'],['#795033','#242a51'],['#265478','#2c315d']][i%5]}
function waveform(){return `<div style="display:flex;align-items:center;gap:3px;height:28px">${[9,18,26,13,22,9,28,19,11,24,15,8].map(h=>`<span style="width:3px;height:${h}px;background:#b4e4ed;border-radius:3px;opacity:.8"></span>`).join('')}</div>`}
function assetCard(r,i){let c=attrGradient(i),label=r.status==='confirmed'?chip('Indexed','good'):chip('Awaiting block','warn');return `<article class="asset"><div class="art" style="--art1:${c[0]};--art2:${c[1]}"><span class="glyph">♫</span><span class="art-tag">${label}</span></div><div class="asset-body"><div class="asset-title">${enc(r.title)}</div><div class="asset-artist">${enc(r.artist)}</div><div class="asset-foot">${chip(licenseName(r.license),'blue')}<button data-action="details" data-id="${enc(r.id)}" class="btn tiny">Details ↗</button></div></div></article>`}
function recentActivity(count=5){return `<div class="timeline">${state.events.slice(0,count).map(e=>`<div class="event ${e.level}"><span class="event-dot"></span><div><div class="event-title">${enc(e.message)}</div><div class="event-meta">${enc(e.type)} · ${fmtDate(e.time)}</div></div></div>`).join('')||'<div class="empty">No events yet.</div>'}</div>`}
function flowMap(){const items=[['studio','01','MUSIC INPUT','Metadata / file'],['provenance','02','INSCRIPTION','Commit → reveal'],['assets','03','INDEXER','Proof + asset'],['tokens','04','BRC-20','Token ledger'],['piracy','05','AI + DRM','Detection / policy']];return `<div class="flow">${items.map((x,i)=>`${i?'<span class="flow-arrow">→</span>':''}<div class="flow-node" data-go="${x[0]}" role="button" tabindex="0"><div class="no">${x[1]} · ${x[2]}</div><div class="name">${x[3]}</div><span class="mini">Open module ↗</span></div>`).join('')}</div>`}
function overview(){const confirmed=state.records.filter(r=>r.status==='confirmed').length;return `
<div class="panel hero mb"><div class="eyebrow">One file · one connected state · zero external services</div><h1>From a music file to a traceable rights and piracy-response workflow.</h1><p>Explore a working visual representation of the proposed platform. Every button below updates the same local JSON state, so you can follow a track from inscription to indexed asset to policy and incident response.</p><div class="hero-actions">${btn('autodemo','▶ Run a complete demonstration','primary')}${btn('tour','Walk through it yourself')}${btn('reset','Reset to sample data','ghost')}</div><div class="stack mt">${chip('Bitcoin: simulated','blue')}${chip('BRC-20: simulated','blue')}${chip('AI detection: scenario-based','warn')}${chip('DRM: policy rules only','warn')}</div></div>
<div class="stats mb">${stat(number(confirmed),'Indexed tracks','Local reference index')}${stat(number(state.pending.length),'Pending operations','Ready to mine')}${stat(number(state.tokens.length),'BRC-20 tickers','Simulated holdings')}${stat(number(state.cases.length),'Piracy cases','Detection scenarios')}</div>
<div class="split-wide mb"><section class="panel"><div class="panel-head"><div><h3>Interactive walkthrough</h3><div class="mini">Follow the demo in order or jump to any module</div></div>${chip(state.guideCompleted.length+'/6 explored','good')}</div><div class="steps">${[
['studio','Register a track','Fill metadata; optionally hash a real local file.'],['node','Simulate commit → reveal','Advance the local block and confirm indexing.'],['assets','Find your music asset','Open the newly indexed record and inspect its IDs.'],['provenance','Verify a claim','Match an inscription ID and optional SHA-256 digest.'],['tokens','Operate a BRC-20 ledger','Deploy, mint, prepare a transfer, then send it.'],['piracy','Test AI + DRM integration','Flag a simulated misuse, apply access rules, draft a report.']].map((x,i)=>`<div class="step"><div class="step-no">${state.guideCompleted.includes(x[0])?'✓':i+1}</div><div><div class="step-title">${x[1]}</div><div class="step-desc">${x[2]}</div></div><button class="btn tiny" data-go="${x[0]}">Explore ↗</button></div>`).join('')}</div></section><section class="panel"><div class="panel-head"><h3>Live state changes</h3>${chip('Shared across all screens','good')}</div>${recentActivity(6)}<div class="divider"></div><div class="notice">This demo illustrates <b>claims and evidence</b>, not proof of copyright ownership. Real inscription, AI analysis, BRC-20 indexing and DRM enforcement need external infrastructure.</div></section></div>
<section class="panel"><div class="panel-head"><h3>How the parts connect</h3><button class="btn tiny" data-go="architecture">Detailed architecture ↗</button></div>${flowMap()}</section>${footer()}`}
function studio(){return `${heading('01 · Create','Inscribe Studio','Register a new music claim, calculate an actual SHA-256 hash if you choose a local file, and simulate Bitcoin commit/reveal.',btn('demoFill','Fill example track','ghost'))}
<div class="split-wide"><section class="panel"><div class="panel-head"><h3>Track & rights registration</h3>${chip('All fields stay local')}</div><form id="inscribeForm"><div class="form-grid"><div class="field"><label class="label" for="trackTitle">Track title *</label><input class="control" id="trackTitle" maxlength="110" required placeholder="e.g. Midnight Signals"></div><div class="field"><label class="label" for="trackArtist">Claimant / artist *</label><input class="control" id="trackArtist" maxlength="110" required placeholder="e.g. Aniket Studios"></div><div class="field"><label class="label" for="trackLicense">Claimed license *</label><select class="control" id="trackLicense"><option value="Exclusive-Rights">Exclusive rights (claim)</option><option value="CC-BY-4.0">CC BY 4.0 (claim)</option><option value="Commercial-RoyaltyFree">Commercial royalty-free (claim)</option></select></div><div class="field"><label class="label" for="trackOwner">Demo wallet</label><input class="control" id="trackOwner" value="demo-wallet" readonly></div><div class="field full"><label class="label" for="trackFile">Optional audio file · MP3 / WAV / FLAC</label><input class="control" id="trackFile" type="file" accept="audio/*,.wav,.flac,.mp3,.m4a,.ogg"><p class="hint">File bytes are hashed in your browser and are never uploaded or persisted. Without a file, a SHA-256 of the metadata is stored and clearly labelled.</p></div></div><div class="divider"></div><label class="stack" style="cursor:pointer;gap:10px;margin-bottom:15px"><input type="checkbox" id="autoMine" ${state.autoMine?'checked':''}> <span class="small">Automatically mine a simulated block after submission</span></label><button class="btn primary full" type="submit" id="submitInscribe">⛓ Simulate commit & reveal</button></form><div class="mt" id="formFeedback"></div></section>
<section class="panel"><div class="panel-head"><h3>What happens when you submit?</h3>${chip('Illustrative','warn')}</div><div class="steps">${[['01','Fingerprint','SHA-256 of the file bytes (or metadata if absent).'],['02','Commit','Prepare a simulated Taproot commitment transaction.'],['03','Reveal','Assign a correctly shaped synthetic inscription ID: txid + i0.'],['04','Index','On a simulated block, map the inscription to a track + rights claim.'],['05','Propagate','The asset, provenance lookup, log, and piracy lab all read the same record.']].map(x=>`<div class="step" style="grid-template-columns:30px 1fr"><div class="step-no">${x[0]}</div><div><div class="step-title">${x[1]}</div><div class="step-desc">${x[2]}</div></div></div>`).join('')}</div><div class="divider"></div><div class="notice warn">An on-chain timestamp or hash can support a provenance timeline, but it cannot by itself prove who wrote, recorded or owns a song.</div><div class="mt">${btn('mine','⛏ Mine pending block','teal',state.pending.length?'':'disabled')}</div></section></div>${footer()}`}
function assets(){const query=state.assetFilter||'';let rs=state.records.filter(r=>(r.title+' '+r.artist+' '+r.id).toLowerCase().includes(query.toLowerCase()));return `${heading('02 · Catalog','Music Assets','A searchable catalog populated from the inscription/indexer state. Select any track to inspect its provenance and permissions.',btn('goStudio','+ New track','primary'))}<div class="panel mb"><div class="stack" style="justify-content:space-between"><div class="stack">${chip(number(state.records.length)+' total','blue')}${chip(number(state.records.filter(r=>r.status==='confirmed').length)+' indexed','good')}${chip(number(state.records.filter(r=>r.status!=='confirmed').length)+' pending','warn')}</div><input class="control" id="assetSearch" style="max-width:295px" placeholder="Search tracks, artists or IDs" value="${enc(query)}" aria-label="Search music assets"></div></div><div id="assetResults" class="asset-grid">${rs.map(assetCard).join('')||'<div class="empty">No tracks match that search.</div>'}</div>${footer()}`}
function details(){const r=activeRecord();if(!r)return '<div class="empty">No track selected. Add one in the Studio.</div>';return `${heading('02 · Asset detail','Asset inspection','Click through the proof references behind the selected music asset.',btn('backAssets','← All assets'))}<section class="panel"><div class="stack mb">${chip(r.status==='confirmed'?'Confirmed in simulation':'Pending simulated confirmation',r.status==='confirmed'?'good':'warn')}${chip(licenseName(r.license))}</div><h2>${enc(r.title)}</h2><p>Claimant: ${enc(r.artist)}</p><div class="grid cols-2">${info('Inscription ID',`<span class="mono wrap">${enc(r.id)}</span>`)}${info('Block height',r.blockHeight?number(r.blockHeight):'Pending')}${info('Claimed license',enc(licenseName(r.license)))}${info('SHA-256 digest',`<span class="mono wrap">${enc(r.fingerprint)}</span>`)}${info('Fingerprint basis',enc(r.hashBasis))}${info('File name',enc(r.fileName||'—'))}${info('Commit tx (mock)',`<span class="mono wrap">${enc(r.commitTx)}</span>`)}${info('Reveal tx (mock)',`<span class="mono wrap">${enc(r.revealTx)}</span>`)}${info('Satpoint (mock)',`<span class="mono wrap">${enc(r.satpoint)}</span>`)}${info('Indexed at',fmtDate(r.createdAt))}</div><div class="divider"></div><div class="stack">${btn('verifySelected','Verify this inscription','primary')}${btn('piracySelected','Evaluate piracy & DRM','ghost')}${btn('copyId','Copy inscription ID','ghost')}${btn('recordJson','Export this record as JSON','ghost')}</div></section><div class="notice warn mt">The artist, rights and license data are self-declared. Fingerprint matching checks file identity, not legal permission, ownership, authenticity of the artist or licensing obligations.</div>${footer()}`}
function provenance(){let r=activeRecord();let last=state.lastResult;return `${heading('03 · Evidence','Provenance & Rights','Search a simulated inscription ID, optionally compare the underlying SHA-256, and inspect the claim chain.')}<div class="split-wide"><section class="panel"><div class="panel-head"><h3>Verify a record</h3>${chip('Local reference index')}</div><form id="verifyForm"><div class="field mb"><label class="label" for="verifyId">Inscription ID</label><input id="verifyId" class="control mono" spellcheck="false" required placeholder="64-character transaction ID + i0" value="${enc(state.verifyId??r?.id??'')}"></div><div class="field mb"><label class="label" for="verifyHash">Optional expected SHA-256 hex</label><input id="verifyHash" class="control mono" pattern="[a-fA-F0-9]{64}" maxlength="64" placeholder="Enter digest for a content match" value="${enc(state.verifyHash||'')}"><div class="hint">Use this only for the hash of the same file or metadata basis.</div></div><button type="submit" class="btn primary full">⌕ Run local verification</button></form><div class="mt">${last?resultBox(last):'<div class="notice">Look up a seeded ID or an inscription you create. No external explorer is contacted.</div>'}</div></section><section class="panel"><div class="panel-head"><h3>What verification means</h3>${chip('Evidence, not legal judgment','warn')}</div>${info('Record found','The ID exists in this local index.')}${info('Hash match','The supplied digest matches the stored reference, when provided.')}${info('Rights claim','License and claimant are metadata assertions.')}${info('Real confirmation','Would require Bitcoin node/indexer verification.')}${info('Legal ownership','Would require independent evidence and adjudication.')}${r?`<div class="divider"></div><div class="stack">${btn('copyId','Copy selected ID','tiny')}${btn('detailsSelected','Open track details','tiny')}</div>`:''}</section></div><section class="panel mt"><div class="panel-head"><h3>Indexed provenance records</h3>${chip(number(state.records.length)+' references')}</div><div class="table-scroll"><table><thead><tr><th>Track / claimant</th><th>Inscription</th><th>Rights claim</th><th>Hash basis</th><th>Block</th><th></th></tr></thead><tbody>${state.records.map(r=>`<tr><td><div class="strong">${enc(r.title)}</div><div class="muted mini">${enc(r.artist)}</div></td><td><span class="mono">${short(r.id,15)}</span></td><td>${chip(licenseName(r.license))}</td><td>${enc(r.hashBasis)}</td><td>${r.blockHeight?number(r.blockHeight):chip('pending','warn')}</td><td><button class="btn tiny" data-action="useVerify" data-id="${enc(r.id)}">Verify ↗</button></td></tr>`).join('')}</tbody></table></div></section>${footer()}`}
function resultBox(res){const good=res.ok,matched=res.match;let title=!good?'Not found in local index':matched===false?'Record found · hash mismatch':matched===true?'Record found · digest matches':'Record found · hash not compared';let cls=!good||matched===false?'warn':'good';return `<div class="notice ${cls}"><b>${enc(title)}</b>${res.record?`<div class="mt"><div>${enc(res.record.title)} — ${enc(res.record.artist)}</div><div class="mini">${enc(licenseName(res.record.license))} · ${enc(res.record.status)} · ${enc(res.record.hashBasis)}</div></div>`:''}<div class="mini" style="margin-top:7px">${good?'This is evidence about a stored claim; copyright ownership is not independently verified.':'Check for typos or index the asset first.'}</div></div>`}
function tokens(){const selected=state.tokenSelected&&tokenByTick(state.tokenSelected)?state.tokenSelected:state.tokens[0]?.tick||'';return `${heading('04 · Fungible layer','BRC-20 Ledger','An interactive JSON ledger that models deploy, mint, transfer inscription preparation, and delivery. Separate from music copyright.',btn('mine','⛏ Mine pending','teal',state.pending.length?'':'disabled'))}<div class="grid cols-3 mb">${state.tokens.map(t=>`<section class="panel slim"><div class="stack" style="justify-content:space-between"><h3 style="margin:0">${enc(t.tick)}</h3>${chip('BRC-20 demo','blue')}</div><div style="font-size:26px;font-weight:850;margin:10px 0">${number(t.balances[state.wallet]||0)}</div><div class="mini">Local wallet balance · minted ${number(t.minted)} / ${number(t.max)}</div><div class="bar mt"><span style="width:${Math.min(100,100*t.minted/t.max)}%"></span></div></section>`).join('')}</div><div class="grid cols-3 mb"><section class="panel"><h3>Deploy a ticker</h3><form id="deployForm"><label class="label">4-character ticker</label><input class="control mb" name="tick" maxlength="4" minlength="4" pattern="[A-Za-z0-9]{4}" placeholder="e.g. BEAT" required><label class="label">Maximum supply</label><input class="control mb" name="max" type="number" min="1" max="1000000000" value="100000" required><label class="label">Per-mint limit</label><input class="control mb" name="lim" type="number" min="1" max="1000000000" value="1000" required><button class="btn full" type="submit">Deploy (mock)</button></form></section><section class="panel"><h3>Mint tokens</h3><form id="mintForm"><label class="label">Ticker</label><select class="control mb" name="tick" required>${state.tokens.map(t=>`<option value="${enc(t.tick)}">${enc(t.tick)}</option>`).join('')}</select><label class="label">Amount</label><input class="control mb" name="amt" type="number" value="100" min="1" step="1" required><div class="notice mb">Mints to <b>${enc(state.wallet)}</b> after the next simulated block.</div><button type="submit" class="btn full">Mint (mock)</button></form></section><section class="panel"><h3>Prepare transfer</h3><form id="transferForm"><label class="label">Ticker</label><select class="control mb" name="tick" required>${state.tokens.map(t=>`<option value="${enc(t.tick)}">${enc(t.tick)}</option>`).join('')}</select><label class="label">Amount</label><input class="control mb" name="amt" type="number" min="1" step="1" value="50" required><label class="label">Recipient (demo label)</label><input class="control mb" name="to" maxlength="50" value="artist-wallet" required><button type="submit" class="btn full">Inscribe transfer intent</button></form></section></div><div class="split-wide"><section class="panel"><div class="panel-head"><h3>Transfer lifecycle</h3>${chip('Prepare → mine → send')}</div>${state.transfers.length?`<div class="table-scroll"><table><thead><tr><th>Intent</th><th>Token</th><th>Amount</th><th>Destination</th><th>Stage</th><th>Action</th></tr></thead><tbody>${state.transfers.map(t=>`<tr><td class="mono">${short(t.id,13)}</td><td>${enc(t.tick)}</td><td>${number(t.amt)}</td><td>${enc(t.to)}</td><td>${chip(t.status,t.status==='sent'?'good':'warn')}</td><td>${t.status==='ready'?`<button class="btn tiny primary" data-action="sendTransfer" data-id="${enc(t.id)}">Send →</button>`:'—'}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No transfer intents yet. Prepare a transfer above.</div>'}</section><section class="panel"><h3>Token operations</h3><div class="timeline mt">${state.tokenOps.slice(0,6).map(o=>`<div class="event ${o.status==='confirmed'?'success':'warning'}"><span class="event-dot"></span><div><div class="event-title">${enc(o.op.toUpperCase())} ${enc(o.tick)} ${o.amt?number(o.amt):''}</div><div class="event-meta">${enc(o.status)} · ${fmtDate(o.time)}</div></div></div>`).join('')||'<div class="empty">Create an operation to see it here.</div>'}</div><div class="notice warn mt">Simplified BRC-20 mechanics. Token balances are a simulated indexer projection; this is not a complete protocol validator or wallet.</div></section></div>${footer()}`}
function piracy(){const rec=activeRecord();let latest=state.cases[0];const decisions=state.accessChecks.slice(0,3);return `${heading('05 · Next integration','AI Detection + DRM Policy Lab','These future components are connected to today’s indexer data, but execute as labelled, deterministic simulations.',chip('No real AI model or DRM agent','warn'))}<div class="grid cols-2 mb"><section class="panel"><div class="panel-head"><h3>AI: suspected misuse detector</h3>${chip('Scenario simulator','warn')}</div><form id="scanForm"><label class="label">Reference asset</label><select class="control mb" name="recordId" required>${choiceRecords(rec?.id)}</select><label class="label">Simulated incident pattern</label><select class="control mb" name="scenario"><option value="exact">Exact file reupload · checksum match</option><option value="altered">Pitch-shifted / compressed reupload</option><option value="commercial">Unlicensed commercial synchronization</option><option value="false">Authorized attribution / low-risk reference</option></select><button class="btn primary full" type="submit">◎ Run mock detection</button></form><div class="notice mt">Demo score is a <b>scenario preset</b>, not a machine-learning confidence estimate. No web content is scanned.</div></section><section class="panel"><div class="panel-head"><h3>DRM: policy decision point</h3>${chip('Rules-based simulator','warn')}</div><form id="drmForm"><label class="label">Reference asset</label><select class="control mb" name="recordId" required>${choiceRecords(rec?.id)}</select><div class="form-grid"><div class="field"><label class="label">Requester</label><select class="control" name="role"><option value="guest">Unlicensed visitor</option><option value="licensee">Licensed user</option><option value="owner">Rights claimant</option></select></div><div class="field"><label class="label">Requested action</label><select class="control" name="action"><option value="preview">Preview</option><option value="play">Play / stream</option><option value="download">Download source</option><option value="remix">Remix / reuse</option></select></div></div><button class="btn full mt" type="submit">⛨ Evaluate access policy</button></form><div class="notice mt">A browser UI cannot reliably prevent copying. Production DRM requires packaging, key management, licenses, playback integration and enforcement.</div></section></div><div class="split-wide"><section class="panel"><div class="panel-head"><h3>Incident response queue</h3>${chip(number(state.cases.length)+' cases')}</div>${state.cases.length?`<div class="table-scroll"><table><thead><tr><th>Case / track</th><th>Pattern</th><th>Demo score</th><th>Status</th><th>Action</th></tr></thead><tbody>${state.cases.map(c=>`<tr><td><span class="mono">${short(c.id,10)}</span><div class="strong">${enc(recordById(c.recordId)?.title||'Unknown')}</div></td><td>${enc(c.label)}</td><td>${chip(c.score+'% mock',c.score>=80?'warn':'blue')}</td><td>${chip(c.status,c.status==='resolved'?'good':'warn')}</td><td>${c.status==='flagged'?`<button class="btn tiny" data-action="prepareReport" data-id="${enc(c.id)}">Create evidence</button>`:c.status==='evidence-ready'?`<button class="btn tiny" data-action="resolveCase" data-id="${enc(c.id)}">Resolve</button>`:'—'}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No incidents yet. Run a simulated detection above.</div>'}</section><section class="panel"><div class="panel-head"><h3>Policy decisions</h3>${chip(number(state.accessChecks.length)+' evaluated')}</div>${decisions.length?decisions.map(d=>`<div class="metric"><div><div class="strong">${enc(recordById(d.recordId)?.title||'Track')}</div><div class="mini">${enc(d.role)} wants to ${enc(d.action)} · ${fmtDate(d.time)}</div></div>${chip(d.allowed?'ALLOW':'DENY',d.allowed?'good':'bad')}</div>`).join(''):'<div class="empty">No access checks yet. Evaluate one above.</div>'}${latest?`<div class="divider"></div><div class="small strong">Most recent incident</div>< architecture=function(){return oldArchitecture().replace('<section class="panel mb"><div class="panel-head"><h3>Connected process map',`<section class="panel mb"><div class="panel-head"><h3>Presenter's guided walkthrough</h3>${chip('Clickable demonstration','good')}</div><p class="help">Select each step and observe the shared record change across modules. The <b>Run complete demo</b> action seeds a connected end-to-end story without external infrastructure.</p><div class="steps">${LIFE.map((s,i)=>`<div class="step"><div class="step-no">${i+1}</div><div><div class="step-title">${s}</div><div class="step-desc">${['Calculate a real SHA-256 locally (or metadata fallback)','Sign structured rights manifest with Web Crypto','Show commit → reveal simulated confirmation','Inspect asset ID, claim and evidence integrity','Grant permission and evaluate an access request','Raise a simulated piracy match and open an incident','Document dispute and human resolution','Export a portable JSON evidence packet'][i]}</div></div><button class="btn tiny" data-action="guideStep" data-id="${i}">Show ↗</button></div>`).join('')}</div><div class="stack mt">${btn('autodemo','▶ Generate connected end-to-end demo','primary')}${btn('tour','Next guided step')}</div></section><section class="panel mb"><div class="panel-head"><h3>Connected process map`).replace('<section class="panel mt"><div class="panel-head"><h3>Portable JSON data',`<section class="panel mt"><div class="panel-head"><h3>Article sources and deployment</h3>${chip('GitHub Pages ready','good')}</div><p class="help">Research basis: Aniket Srivastava’s four-article BRC-20 / Ordinals / Music series on Medium, especially <a href="https://medium.com/@aniketsrivastava81/brc-20-and-ordinals-inside-nexusord-a-ordinals-and-music-provenance-concept-52886e928d5e" target="_blank" rel="noopener noreferrer">Inside NEXUSORD</a>. Save this single HTML as <b>index.html</b> and publish the file at repository root with GitHub Pages. No build tools, APIs, images or remote fonts are required. Local SHA-256 and signatures use the browser’s native Web Crypto API. The test files never leave the browser.</p><div class="notice warn">Project status: interactive architecture demonstration. Real blockchain integration, production rights review, AI fingerprinting, a secure DRM licence server and authentication are future work. A seeded sample fingerprint is illustrative, not backed by stored audio. Always review permissions independently.</div></section><section class="panel mt"><div class="panel-head"><h3>Portable JSON data`).replace("['05','AI connector (next phase)'","['05','AI connector (next phase)'")};
async function checkRecord(r,expectedFile){const data=await verifySignedPayload(r);const fileHash=expectedFile?await shaBytes(await expectedFile.arrayBuffer()):null;const matching=fileHash!==null?fileHash===r.fingerprint:null;return {...data,matching,fileHash};}
function policy(record,role,action){const dispute=state.disputes.some(d=>d.recordId===record.id&&d.status==='open');if(dispute&&['download','remix'].includes(action))return {allowed:false,reason:'Claim under dispute; restricted use blocked pending human review.'};if(role==='owner')return {allowed:true,reason:'Demo claimant policy (authority not independently verified).'};const grant=state.grants.find(g=>g.recordId===record.id&&g.principal===role&&g.action===action);if(grant)return {allowed:true,reason:'Explicit demo permission grant found.'};if(record.license==='CC-BY-4.0'&&['preview','play'].includes(action))return {allowed:true,reason:'Demo CC BY public preview/play rule; attribution and other obligations still apply.'};return {allowed:false,reason:'No applicable permission entitlement for this requested action.'};}
function simulateScan(record,scenario,hashMatch=null){const presets={exact:['Exact-content reupload',96,'Provenance: an identical digest alone does not establish infringing use.'],altered:['Transcoded or pitch-shifted recording',87,'Illustrative similarity only; real audio fingerprinting is not connected.'],commercial:['Suspected unlicensed commercial use',78,'Commercial usage claim is scenario-supplied, not verified.'],false:['Likely authorized attribution',14,'Human review required to avoid false positives.']};const x=presets[scenario]||presets.exact;const score=hashMatch===false&&scenario==='exact'?15:x[1];const label=hashMatch===false&&scenario==='exact'?'Different bytes · exact match failed':x[0];return {id:idHex().slice(0,16),recordId:record.id,scenario,label,score,time:stamp(),status:score<30?'reviewed':'flagged',evidence:x[2],exactFileMatch:hashMatch};}
function allChecks(){const checks=[];const ids=state.records.map(r=>r.id);checks.push(['Unique inscription IDs',new Set(ids).size===ids.length]);checks.push(['Plausible reference SHA-256 formats',state.records.every(r=>hexFor(r.fingerprint))]);checks.push(['No token over minted supply',state.tokens.every(t=>t.minted<=t.max)]);checks.push(['Ledger balances equal minted supply',state.tokens.every(t=>Object.values(t.balances).reduce((a,b)=>a+b,0)===t.minted)]);checks.push(['No negative available balances',state.tokens.every(t=>tokenAvailable(t.tick)>=0)]);checks.push(['All incident/rights references exist',state.cases.every(x=>recordById(x.recordId))&&state.grants.every(x=>recordById(x.recordId))&&state.disputes.every(x=>recordById(x.recordId))]);checks.push(['Indexer cannot lead chain',state.indexedHeight<=state.blockHeight]);return checks;}
async function autoDemo(){try{toast('Creating a connected music provenance example…');const bytes=new TextEncoder().encode('NEXUSORD tutorial demonstration audio-reference v1');const r=await createMusic({title:'Studio Session · Demonstration '+(state.records.length+1),artist:'NEXUSORD Demo Studio',license:'Exclusive-Rights',licenseText:'Training-only licence: preview allowed for studio, commercial reuse requires a separate signed permission grant.',rightsScope:'master',fileName:'tutorial-reference.txt',fileSize:bytes.byteLength,bytes});state.demoId=r.id;mineBlock();mineBlock();state.grants.unshift({id:idHex().slice(0,12),recordId:r.id,principal:'licensee',action:'play',time:stamp()});const p=policy(r,'licensee','play');state.accessChecks.unshift({id:idHex().slice(0,14),time:stamp(),recordId:r.id,role:'licensee',action:'play',allowed:p.allowed,reason:p.reason});const c=simulateScan(r,'altered');state.cases.unshift(c);state.disputes.unshift({id:idHex().slice(0,14),recordId:r.id,reason:'Conflicting authorship claim',notes:'Guided-demo review: check signed contributor agreement',time:stamp(),status:'open'});log('workflow','Demo end-to-end: hash → signature → two simulated blocks → index → entitlement → AI incident → dispute','success',r.id);state.selectedId=r.id;persist();changeView('overview');toast('Connected demonstration created across all modules. Open walkthrough or a module to inspect.');}catch(e){toast('Demo failed: '+e.message,true)}}
function handleAction(action,id){const r=activeRecord();switch(action){case 'autodemo':autoDemo();break;case 'goStudio':changeView('studio');break;case 'backAssets':changeView('assets');break;case 'goRights':changeView('rights');break;case 'verifySelected':case 'useVerify':{const x=id?recordById(id):r;if(!x)return;state.selectedId=x.id;state.verifyId=x.id;state.verifyHash='';state.lastResult=null;changeView('provenance');break;}case 'details':case 'detailsSelected':case 'openAsset':state.selectedId=id||r?.id;changeView('details');break;case 'piracySelected':changeView('piracy');break;case 'copyId':if(r){navigator.clipboard?.writeText(r.id).then(()=>toast('Inscription ID copied')).catch(()=>toast('Copy failed; select ID manually',true))}break;case 'recordJson':if(r)downloadJson(r,'nexusord-record-'+r.id.slice(0,12)+'.json');break;case 'exportEvidence':if(r)downloadJson(evidencePackage(r),'nexusord-evidence-'+r.id.slice(0,12)+'.json');break;case 'previewAsset':if(r){const p=policy(r,'guest','preview');state.accessChecks.unshift({recordId:r.id,role:'guest',action:'preview',allowed:p.allowed,time:stamp(),reason:p.reason});if(!p.allowed)toast('Preview denied: '+p.reason,true);else if(!mediaUrls.has(r.id))toast('Access allowed by demo policy, but audio bytes are not retained. Re-upload in this session to preview.',true);else{const sound=new Audio(mediaUrls.get(r.id));sound.play().catch(()=>toast('Browser blocked playback',true));toast('Preview requested. This is not actual DRM encryption.')}persist();}break;case 'mine':mineBlock();break;case 'toggleIndexer':state.indexerPaused=!state.indexerPaused;log('indexer',state.indexerPaused?'Indexer paused — chain may advance independently':'Indexer unpaused — use catch up to process missed events');persist();render();break;case 'syncIndexer':syncIndexer();break;case 'reorg':reorgBlock();break;case 'sendTransfer':{const t=state.transfers.find(x=>x.id===id);if(!t||t.status!=='ready')return;const o=tokenAction('send',t.tick,t.amt,{transferId:t.id});t.status='sending';persist();render();toast('Token transfer broadcast to simulated mempool; mine a block to settle.');break;}case 'prepareReport':{const c=state.cases.find(x=>x.id===id);if(c){c.status='evidence-ready';c.report={inscriptionId:recordById(c.recordId)?.id,scenario:c.scenario,evidence:c.evidence,generatedAt:stamp(),limitations:'Scenario-based suspected misuse; no AI/Internet scan or legal finding'};log('ai','Evidence packet prepared for incident '+c.id,'success',c.recordId);persist();render();}break;}case 'resolveCase':{const c=state.cases.find(x=>x.id===id);if(c){c.status='resolved';c.resolution='Reviewed in mock workflow; no takedown was executed';log('human-review','Case '+c.id+' moved to human reviewed; no automatic enforcement','success',c.recordId);persist();render();}break;}case 'closeDispute':{const d=state.disputes.find(x=>x.id===id);if(d){d.status='reviewed';d.resolution='Demo reviewer closed case; evidence retained';log('claims','Dispute '+d.id+' reviewed; original record preserved','success',d.recordId);persist();render();}break;}case 'demoFill':{el('trackTitle').value='Midnight Signal · New sample';el('trackArtist').value='Aniket Studio';el('trackLicense').value='Exclusive-Rights';el('licenseText').value='Non-exclusive preview permitted; commercial synchronization or derivative reuse requires a written agreement.';toast('Example fields populated. Submit to create a claim.');break;}case 'clearLogs':state.events=[];persist();render();break;case 'export':downloadJson({type:'NEXUSORD_DEMO_STATE',exportedAt:stamp(),state},'nexusord-demo-state.json');break;case 'import':{let f=el('importFile');if(!f){f=document.createElement('input');f.type='file';f.id='importFile';f.accept='.json,application/json';f.hidden=true;document.body.append(f);f.addEventListener('change',async()=>{try{const d=JSON.parse(await f.files[0].text());const x=d.state||d;if(x.version!==3||!Array.isArray(x.records)||!Array.isArray(x.tokens)||!Array.isArray(x.pending))throw Error('Not a matching NEXUSORD v3 state');state=x;ensureFields();log('state','Imported saved local JSON state','success');persist();render();toast('State imported.');}catch(e){toast('Import rejected: '+e.message,true)}finally{f.value=''}})}f.click();break;}case 'viewState':changeView('architecture');break;case 'diagnostics':{const checks=allChecks();const box=el('diagnosticsResult');if(box)box.innerHTML=checks.map(([name,ok])=>`<div class="metric"><span>${enc(name)}</span>${chip(ok?'PASS':'FAIL',ok?'good':'bad')}</div>`).join('');toast(`${checks.filter(x=>x[1]).length}/${checks.length} demo invariants passed`);break;}case 'reset':if(confirm('Reset all local NEXUSORD demo changes?')){state=deep(seed);ensureFields();mediaUrls.forEach(u=>URL.revokeObjectURL(u));mediaUrls.clear();persist();render();toast('Reset to sample data.')}break;case 'tour':{state.guideStep=(state.guideStep+1)%LIFE.length;const map=['studio','provenance','node','assets','rights','piracy','rights','architecture'];changeView(map[state.guideStep]);toast(`Walkthrough ${state.guideStep+1}/8 · ${LIFE[state.guideStep]}`);break;}case 'guideStep':{const i=Number(id);const map=['studio','provenance','node','assets','rights','piracy','rights','architecture'];state.guideStep=i;changeView(map[i]||'overview');toast(`Walkthrough ${i+1}/8 · ${LIFE[i]}`);break;}default:toast('Unknown action: '+action,true);}}
async function onForm(e){const form=e.target;if(!['inscribeForm','verifyForm','deployForm','mintForm','transferForm','scanForm','drmForm','grantForm','disputeForm','correctForm','evidenceForm'].includes(form.id))return;e.preventDefault();const data=new FormData(form);try{
 if(form.id==='inscribeForm'){const f=el('trackFile').files[0];if(f&&f.size>30*1024*1024)throw Error('Demo file is limited to 30 MiB for browser-memory safety (not an Ordinals limit).');const raw=f?await f.arrayBuffer():null;const r=await createMusic({title:safeText(el('trackTitle').value),artist:safeText(el('trackArtist').value),license:el('trackLicense').value,rightsScope:el('rightsScope').value,licenseText:safeText(el('licenseText').value),supportRef:safeText(el('supportRef').value),fileName:f?.name||'',fileSize:f?.size||0,bytes:raw});if(f)mediaUrls.set(r.id,URL.createObjectURL(f));if(el('autoMine').checked){mineBlock();mineBlock();toast('Track signed, simulated commit/reveal confirmed; see provenance!');}else{persist();changeView('node');toast('Commit queued. Mine twice: commit block, then reveal block.')} }
 else if(form.id==='verifyForm'){const id=el('verifyId').value.trim();const r=recordById(id);const digest=el('verifyHash').value.trim().toLowerCase();const f=el('verifyFile').files[0];let match=null;if(digest&&r)match=digest===r.fingerprint;if(f&&r)match=(await shaBytes(await f.arrayBuffer()))===r.fingerprint;const detail=r?await verifySignedPayload(r):null;state.verifyId=id;state.verifyHash=digest;state.lastResult={ok:!!r,record:r?{...r}:null,match,cryptographic:detail};log('provenance',`Lookup ${id.slice(0,15)}… · ${!r?'not found':match===false?'HASH MISMATCH':detail?.status==='PASS'?'signature & licence hash pass':'reference located'}`,r?'info':'warning',r?.id);persist();render();const box=el('verificationDetails');if(box)box.textContent='';const existing=el('page').querySelector('.split-wide .panel:first-child');if(existing&&detail){const d=document.createElement('div');d.className='notice mt '+(detail.status==='PASS'?'good':'warn');d.textContent=`Manifest hash ${detail.manifest?'PASS':'missing / failed'} · ECDSA signature ${detail.sig?'PASS':'missing / failed'} · preserved licence ${detail.licence?'PASS':'missing / failed'}. ${r.hashBasis==='file bytes (SHA-256)'?'SHA-256 references an actual selected file.':'Seed / metadata-only source is not verified audio bytes.'}`;existing.append(d);} }
 else if(form.id==='deployForm'){const tick=String(data.get('tick')).trim().toUpperCase(),max=Number(data.get('max')),lim=Number(data.get('lim'));if(!/^[A-Z0-9]{4}$/.test(tick)||!Number.isSafeInteger(max)||!Number.isSafeInteger(lim)||max<1||lim<1||lim>max)throw Error('Ticker must be 4 alphanumerics; 0 < mint limit ≤ supply.');if(tokenByTick(tick)||state.tokenOps.some(x=>x.op==='deploy'&&x.tick===tick))throw Error('Ticker already deployed or queued.');tokenAction('deploy',tick,0,{max,limit:lim});persist();render();toast('Deployment queued; mine a simulated block.');}
 else if(form.id==='mintForm'){const tick=String(data.get('tick')),amt=Number(data.get('amt'));const t=tokenByTick(tick);if(!t)throw Error('Choose a confirmed ticker');if(anyPendingToken(tick))throw Error('Mine the prior operation for this ticker first');if(!Number.isSafeInteger(amt)||amt<=0||amt>t.limit||amt+t.minted>t.max)throw Error('Mint violates per-mint limit or max supply.');tokenAction('mint',tick,amt,{wallet:state.wallet});persist();render();toast('Mint queued; mine a simulated block.');}
 else if(form.id==='transferForm'){const tick=String(data.get('tick')),amt=Number(data.get('amt')),to=safeText(data.get('to'));if(anyPendingToken(tick))throw Error('Mine the prior operation for this ticker first');if(!Number.isSafeInteger(amt)||amt<=0||amt>tokenAvailable(tick))throw Error('Insufficient unlocked demo balance.');if(!to||to===state.wallet)throw Error('Recipient must be another demo wallet label');const tr={id:idHex().slice(0,18),tick,amt,from:state.wallet,to,status:'inscribing',time:stamp()};state.transfers.unshift(tr);tokenAction('prepare',tick,amt,{transferId:tr.id});persist();render();toast('Transfer intent queued. Mine to prepare, click Send, then mine again.');}
 else if(form.id==='scanForm'){const r=recordById(data.get('recordId'));if(!r)throw Error('Track missing');const f=data.get('suspectFile');let matching=null;if(f&&f.size)matching=(await shaBytes(await f.arrayBuffer()))===r.fingerprint;const c=simulateScan(r,String(data.get('scenario')),matching);state.cases.unshift(c);log('ai',`Mock scan case ${c.id}: ${c.label} · ${c.score}% scenario score`,'warning',r.id);persist();render();toast('Scenario-based incident added to review queue.');}
 else if(form.id==='drmForm'){const r=recordById(data.get('recordId')),role=String(data.get('role')),action=String(data.get('action'));if(!r)throw Error('Track missing');const p=policy(r,role,action);state.accessChecks.unshift({id:idHex().slice(0,14),time:stamp(),recordId:r.id,role,action,allowed:p.allowed,reason:p.reason});log('drm',`${p.allowed?'ALLOW':'DENY'} ${role} ${action} · ${p.reason}`,p.allowed?'success':'warning',r.id);persist();render();toast(`${p.allowed?'ALLOWED':'DENIED'} — ${p.reason}`,!p.allowed);}
 else if(form.id==='grantForm'){const r=recordById(data.get('recordId'));if(!r)throw Error('Track missing');const g={id:idHex().slice(0,15),time:stamp(),recordId:r.id,principal:safeText(data.get('principal')),action:String(data.get('action'))};if(!g.principal)throw Error('Recipient is required');state.grants.unshift(g);log('license',`Explicit demo ${g.action} grant issued for ${g.principal}`,'success',r.id);persist();render();toast('Permission grant saved; test the licensee policy.');}
 else if(form.id==='disputeForm'){const r=recordById(data.get('recordId'));if(!r)throw Error('Track missing');const d={id:idHex().slice(0,15),recordId:r.id,reason:safeText(data.get('reason')),notes:safeText(data.get('notes')),status:'open',time:stamp()};state.disputes.unshift(d);log('claims',`Dispute opened: ${d.reason}`,'warning',r.id);persist();render();toast('Dispute appended; previous provenance record preserved.');}
 else if(form.id==='correctForm'){const old=recordById(data.get('recordId'));if(!old)throw Error('Track missing');const licenseText=safeText(data.get('licenseText'));if(!licenseText)throw Error('Replacement licence is required');const createdAt=stamp();const ref=issueRecordId();const manifest={schema:'nexusord-music-claim-v1',network:'bitcoin-regtest-SIMULATED',assetVersion:(old.versionNumber||1)+1,title:old.title,claimant:old.artist,rightsScope:old.rightsScope,fileName:old.fileName||null,fileSize:old.fileSize||0,contentSha256:old.fingerprint,hashBasis:old.hashBasis,licenseCategory:old.license,licenseSha256:await shaText(licenseText),parentInscriptionId:old.id,createdAt};const signed=await signManifest(manifest);const newer={...deep(old),...ref,...signed,parentId:old.id,versionNumber:manifest.assetVersion,licenseText,createdAt,status:'pending-commit',blockHeight:null,reviewStatus:'Correction self-declared; not independently reviewed'};delete newer.supersededBy;state.records.unshift(newer);old.supersededBy=newer.id;state.selectedId=newer.id;state.pending.push({id:idHex().slice(0,14),kind:'commit',recordId:newer.id,label:newer.title+' · correction commit'});log('correction',`Append-only v${newer.versionNumber} supersedes claim ${old.id.slice(0,14)}…`,'warning',newer.id);persist();changeView('provenance');toast('New signed version queued. Earlier record remains inspectable.');}
 else if(form.id==='evidenceForm'){const f=data.get('bundle');if(!f||!f.size)throw Error('Choose a JSON evidence packet');const bundle=JSON.parse(await f.text());if(bundle.format!=='nexusord-evidence-v1')throw Error('Not an evidence packet from this app');const v=await verifySignedPayload(bundle);const msg=`Evidence signature: ${v.sig?'PASS':'FAIL / missing'} · Manifest digest: ${v.manifest?'PASS':'FAIL / missing'} · Licence text: ${v.licence?'PASS':'FAIL / missing'} · Overall ${v.status}. Simulated network reference is not externally verified.`;const target=el('evidenceCheckResult');target.innerHTML=`<div class="notice ${v.status==='PASS'?'good':'warn'}">${enc(msg)}</div>`;toast(v.status==='PASS'?'Portable evidence checks passed':'Evidence missing or changed',v.status!=='PASS');}
 }catch(err){toast(err.message||String(err),true);console.error(err);}}
// Event delegation ensures dynamic navigation, cards, forms and charts work after re-renders.

window.NEXUSORD_DEMO={getState:()=>deep(state),createMusic,mineBlock,syncIndexer,policy,checkRecord,allChecks,autoDemo,reset:()=>{state=deep(seed);ensureFields();persist();render()},setIndexerPause:b=>{state.indexerPaused=!!b;persist()},reorgBlock};
